---
layout: default
---
<article class="wrap prose page">
  <header class="page-header">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  {{ content }}
</article>
