# Hedgehog Bits website
# Built with Jekyll for GitHub Pages. See README.md for local preview and deployment.

title: Hedgehog Bits
tagline: A private, offline vault for iPhone
description: >-
  Hedgehog Bits is an encrypted, offline vault for iPhone that looks like a
  collection of quick brain games. Notes, photos, videos and files are encrypted
  on the device with Argon2id and AES-256-GCM. No servers, no accounts, no sync.
lang: en

# Set these when you know the final address.
# - Project site:  url: "https://<user>.github.io"  baseurl: "/<repo-name>"
# - User site or custom domain: url: "https://hedgehogbits.app"  baseurl: ""
# On GitHub Pages, `url` is filled in automatically if left empty.
url: "https://hedgehogbits.com"
baseurl: ""

# Leave empty until the app is live; the site then shows "Coming soon to the App Store".
app_store_url: ""
# The numeric App Store ID (from the App Store URL, without "id"). When set, Safari on
# iPhone shows Apple's Smart App Banner at the top of every page.
app_store_id: ""
# Optional contact address shown in the footer and on the privacy page.
contact_email: "info@hedgehogbits.com"

author:
  name: Hedgehog Bits
  type: Organization
  url: "https://hedgehogbits.com/"
logo: /assets/images/app-icon.png
social:
  name: Hedgehog Bits
  links: []


app:
  name: Hedgehog Bits
  platform: iPhone
  os_requirement: iOS 26 or later
  category: Utilities
  price: "0"
  version: "1.0"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

permalink: /blog/:year/:month/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page
  # Default social preview image for every page and post (jekyll-seo-tag).
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og-image.png
        width: 1200
        height: 630
        alt: "Hedgehog Bits: a private, offline vault for iPhone"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache

include:
  - .well-known
